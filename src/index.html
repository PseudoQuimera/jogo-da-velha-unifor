<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jogo da Velha | UNIFOR</title>

  <style>
    :root {
      --blue: #003366;
      --blue-highlight: #0056b3;
      --orange: #d97706;
      --orange-light: #f59e0b;
      --bg: #f4f6f9;
      --white: #ffffff;
      --text: #172033;
      --muted: #667085;
      --border: #d9e1ea;
      --shadow: 0 18px 50px rgba(0, 51, 102, .12);
      --radius: 24px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 10% 0%, rgba(0, 86, 179, .08), transparent 32%),
        radial-gradient(circle at 90% 10%, rgba(217, 119, 6, .08), transparent 30%),
        var(--bg);
      color: var(--text);
      overflow-x: hidden;
    }

    button,
    select {
      font: inherit;
    }

    .app {
      width: min(960px, calc(100% - 32px));
      margin: 0 auto;
      padding: 42px 0 50px;
      position: relative;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 22px;
      margin-bottom: 28px;
      text-align: left;
    }

    .logo-unifor {
      width: 82px;
      height: 82px;
      object-fit: contain;
      flex-shrink: 0;
    }

    .header-content {
      display: flex;
      flex-direction: column;
      justify-content: center;
    }


    .institution {
      color: var(--blue-highlight);
      font-size: .78rem;
      font-weight: 800;
      letter-spacing: .18em;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    h1 {
      color: var(--blue);
      font-size: clamp(2rem, 6vw, 3.6rem);
      line-height: 1;
      font-weight: 900;
      letter-spacing: -.045em;
    }

    .subtitle {
      margin-top: 10px;
      color: var(--muted);
      font-size: .95rem;
    }

    .panel {
      background: rgba(255, 255, 255, .94);
      border: 1px solid rgba(217, 225, 234, .9);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      backdrop-filter: blur(12px);
    }

    .controls {
      padding: 20px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 18px;
    }

    .control-group label {
      display: block;
      color: var(--blue);
      font-size: .78rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: .08em;
      margin-bottom: 8px;
    }

    select {
      width: 100%;
      appearance: none;
      background:
        linear-gradient(45deg, transparent 50%, var(--blue-highlight) 50%) calc(100% - 18px) 50% / 6px 6px no-repeat,
        linear-gradient(135deg, var(--blue-highlight) 50%, transparent 50%) calc(100% - 14px) 50% / 6px 6px no-repeat,
        var(--bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 13px 40px 13px 14px;
      color: var(--text);
      font-weight: 700;
      outline: none;
      cursor: pointer;
      transition: .2s ease;
    }

    select:focus {
      border-color: var(--blue-highlight);
      box-shadow: 0 0 0 4px rgba(0, 86, 179, .1);
    }

    .scoreboard {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: stretch;
      gap: 12px;
      margin-bottom: 18px;
    }

    .score-card {
      min-height: 108px;
      padding: 17px 20px;
      border-radius: 18px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      background: var(--white);
      border: 1px solid var(--border);
      box-shadow: 0 8px 25px rgba(0, 51, 102, .06);
    }

    .score-card.x {
      border-top: 4px solid var(--blue-highlight);
    }

    .score-card.o {
      border-top: 4px solid var(--orange);
      text-align: right;
    }

    .player-name {
      color: var(--muted);
      font-size: .76rem;
      text-transform: uppercase;
      letter-spacing: .08em;
      font-weight: 800;
    }

    .score {
      font-size: 2.7rem;
      line-height: 1;
      font-weight: 900;
      margin-top: 5px;
    }

    .score.x-score {
      color: var(--blue-highlight);
    }

    .score.o-score {
      color: var(--orange);
    }

    .round {
      min-width: 125px;
      padding: 16px;
      border-radius: 18px;
      background: var(--blue);
      color: white;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    .round-label {
      font-size: .7rem;
      text-transform: uppercase;
      letter-spacing: .12em;
      opacity: .72;
      font-weight: 800;
    }

    .round-value {
      margin-top: 5px;
      font-size: 1.45rem;
      font-weight: 900;
    }

    .game-panel {
      padding: 26px;
      position: relative;
      overflow: hidden;
    }

    .status {
      min-height: 50px;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      color: var(--blue);
      font-size: 1.05rem;
      font-weight: 800;
      margin-bottom: 20px;
    }

    .status.winner {
      color: var(--orange);
    }

    .status.draw {
      color: var(--blue-highlight);
    }

    .board-wrap {
      width: min(440px, 100%);
      aspect-ratio: 1;
      margin: 0 auto;
      position: relative;
    }

    .board {
      width: 100%;
      height: 100%;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      position: relative;
      z-index: 2;
    }

    .cell {
      border: 0;
      border-radius: 18px;
      background: #f7f9fc;
      border: 1px solid #e1e7ef;
      box-shadow: inset 0 -4px 0 rgba(0, 51, 102, .035);
      cursor: pointer;
      color: var(--blue);
      font-size: clamp(3rem, 12vw, 5.4rem);
      font-weight: 900;
      line-height: 1;
      transition:
        transform .16s ease,
        background .16s ease,
        box-shadow .16s ease;
      user-select: none;
    }

    .cell:hover:not(:disabled) {
      transform: translateY(-3px);
      background: #eef5fc;
      box-shadow:
        0 10px 22px rgba(0, 86, 179, .1),
        inset 0 -4px 0 rgba(0, 86, 179, .04);
    }

    .cell:active:not(:disabled) {
      transform: scale(.96);
    }

    .cell:disabled {
      cursor: default;
    }

    .cell.x {
      color: var(--blue-highlight);
      animation: pop .22s ease-out;
    }

    .cell.o {
      color: var(--orange);
      animation: pop .22s ease-out;
    }

    .cell.winning {
      animation: winnerCell .65s ease-in-out infinite alternate;
      background: #fff8eb;
      border-color: rgba(217, 119, 6, .3);
    }

    .win-line {
      position: absolute;
      height: 7px;
      border-radius: 99px;
      background: linear-gradient(90deg, var(--orange), var(--orange-light));
      box-shadow:
        0 0 0 3px rgba(255, 255, 255, .8),
        0 0 22px rgba(217, 119, 6, .55);
      transform-origin: left center;
      z-index: 5;
      opacity: 0;
      pointer-events: none;
      transition: opacity .25s ease;
    }

    .win-line.show {
      opacity: 1;
      animation: lineIn .55s cubic-bezier(.2,.8,.2,1);
    }

    .actions {
      display: flex;
      justify-content: center;
      margin-top: 24px;
    }

    .reset {
      border: 0;
      border-radius: 13px;
      padding: 13px 22px;
      background: var(--blue);
      color: white;
      font-weight: 800;
      letter-spacing: .04em;
      cursor: pointer;
      box-shadow: 0 8px 18px rgba(0, 51, 102, .2);
      transition: .2s ease;
    }

    .reset:hover {
      background: var(--blue-highlight);
      transform: translateY(-2px);
    }

    .reset:active {
      transform: translateY(0);
    }

    .hint {
      text-align: center;
      margin-top: 17px;
      color: var(--muted);
      font-size: .78rem;
    }

    #confetti {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 100;
    }

    .champion-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 22, 45, .55);
      backdrop-filter: blur(7px);
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      opacity: 0;
      visibility: hidden;
      transition: .25s ease;
    }

    .champion-overlay.show {
      opacity: 1;
      visibility: visible;
    }

    .champion-card {
      width: min(420px, 100%);
      background: white;
      border-radius: 28px;
      padding: 36px 26px;
      text-align: center;
      box-shadow: 0 30px 80px rgba(0, 0, 0, .25);
      transform: translateY(20px) scale(.96);
      transition: .3s ease;
    }

    .champion-overlay.show .champion-card {
      transform: translateY(0) scale(1);
    }

    .trophy {
      font-size: 3.5rem;
      margin-bottom: 10px;
    }

    .champion-card h2 {
      color: var(--blue);
      font-size: 1.8rem;
      margin-bottom: 8px;
    }

    .champion-card p {
      color: var(--muted);
      margin-bottom: 22px;
    }

    .champion-close {
      border: 0;
      background: var(--orange);
      color: white;
      border-radius: 12px;
      padding: 12px 24px;
      font-weight: 800;
      cursor: pointer;
    }

    .thinking {
      animation: pulse 1s ease-in-out infinite;
    }

    @keyframes pop {
      0% { transform: scale(.55); opacity: .2; }
      70% { transform: scale(1.08); }
      100% { transform: scale(1); opacity: 1; }
    }

    @keyframes winnerCell {
      from { transform: scale(1); }
      to { transform: scale(1.035); }
    }

    @keyframes lineIn {
      from { transform: scaleX(0); opacity: .1; }
      to { opacity: 1; }
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: .45; }
    }

    @media (max-width: 620px) {
      .app {
        width: min(100% - 20px, 960px);
        padding-top: 25px;
      }

      .controls {
        grid-template-columns: 1fr;
      }

      .game-panel {
        padding: 18px;
      }

      .scoreboard {
        grid-template-columns: 1fr 80px 1fr;
      }

      .score-card {
        min-height: 92px;
        padding: 12px;
      }

      .round {
        min-width: 0;
        padding: 10px;
      }

      .score {
        font-size: 2.1rem;
      }

      .player-name {
        font-size: .65rem;
      }

      .board {
        gap: 7px;
      }

      .cell {
        border-radius: 13px;
      }

      .win-line {
        height: 5px;
      }
    }
  </style>
</head>

<body>
  <canvas id="confetti"></canvas>

  <main class="app">
    <header>
      <img
        src="https://uol.unifor.br/acesso/app/autenticacao/assets/img/logos/icon-unifor.svg"
        alt="Logo da Universidade de Fortaleza"
        class="logo-unifor"
      >

      <div class="header-content">
        <div class="institution">Universidade de Fortaleza</div>
        <h1>Jogo da Velha</h1>
        <p class="subtitle">Desafie seus amigos ou enfrente o computador.</p>
      </div>
    </header>


    <section class="panel controls" aria-label="Configurações da partida">
      <div class="control-group">
        <label for="modeSelect">Modo de Jogo</label>
        <select id="modeSelect">
          <option value="pvp">2 Jogadores (PVP)</option>
          <option value="cpu">Contra o Computador</option>
        </select>
      </div>

      <div class="control-group">
        <label for="formatSelect">Formato da Partida</label>
        <select id="formatSelect">
          <option value="single">Partida Única</option>
          <option value="bo3">Melhor de 3 (MD3)</option>
        </select>
      </div>
    </section>

    <section class="scoreboard">
      <div class="score-card x">
        <span class="player-name">Jogador X</span>
        <strong class="score x-score" id="winsX">0</strong>
      </div>

      <div class="round">
        <span class="round-label">Rodada</span>
        <strong class="round-value" id="roundValue">1/1</strong>
      </div>

      <div class="score-card o">
        <span class="player-name" id="playerOLabel">Jogador O</span>
        <strong class="score o-score" id="winsO">0</strong>
      </div>
    </section>

    <section class="panel game-panel">
      <div class="status" id="status" aria-live="polite">
        Vez do Jogador X
      </div>

      <div class="board-wrap" id="boardWrap">
        <div class="board" id="board" role="grid" aria-label="Tabuleiro do Jogo da Velha">
          <button class="cell" data-index="0" aria-label="Célula 1"></button>
          <button class="cell" data-index="1" aria-label="Célula 2"></button>
          <button class="cell" data-index="2" aria-label="Célula 3"></button>
          <button class="cell" data-index="3" aria-label="Célula 4"></button>
          <button class="cell" data-index="4" aria-label="Célula 5"></button>
          <button class="cell" data-index="5" aria-label="Célula 6"></button>
          <button class="cell" data-index="6" aria-label="Célula 7"></button>
          <button class="cell" data-index="7" aria-label="Célula 8"></button>
          <button class="cell" data-index="8" aria-label="Célula 9"></button>
        </div>

        <div class="win-line" id="winLine"></div>
      </div>

      <div class="actions">
        <button class="reset" id="resetButton">REINICIAR JOGO</button>
      </div>

      <p class="hint">
        X começa a partida. No modo contra o computador, a CPU joga como O.
      </p>
    </section>
  </main>

  <div class="champion-overlay" id="championOverlay">
    <div class="champion-card">
      <div class="trophy">🏆</div>
      <h2 id="championTitle">Campeão!</h2>
      <p id="championText"></p>
      <button class="champion-close" id="championClose">FECHAR</button>
    </div>
  </div>

  <script>
    (() => {
      "use strict";

      // ============================================================
      // Estado
      // ============================================================

      const state = {
        options: Array(9).fill(""),
        currentPlayer: "X",
        running: true,
        winsX: 0,
        winsO: 0,
        currentRound: 1,
        modeSelect: "pvp",
        formatSelect: "single",
        transitionTimer: null,
        cpuTimer: null
      };

      const winPatterns = [
        [0, 1, 2],
        [3, 4, 5],
        [6, 7, 8],
        [0, 3, 6],
        [1, 4, 7],
        [2, 5, 8],
        [0, 4, 8],
        [2, 4, 6]
      ];

      // ============================================================
      // DOM
      // ============================================================

      const cells = [...document.querySelectorAll(".cell")];
      const boardWrap = document.getElementById("boardWrap");
      const winLine = document.getElementById("winLine");

      const statusEl = document.getElementById("status");
      const winsXEl = document.getElementById("winsX");
      const winsOEl = document.getElementById("winsO");
      const roundValueEl = document.getElementById("roundValue");
      const playerOLabelEl = document.getElementById("playerOLabel");

      const modeSelect = document.getElementById("modeSelect");
      const formatSelect = document.getElementById("formatSelect");
      const resetButton = document.getElementById("resetButton");

      const championOverlay = document.getElementById("championOverlay");
      const championTitle = document.getElementById("championTitle");
      const championText = document.getElementById("championText");
      const championClose = document.getElementById("championClose");

      // ============================================================
      // Áudio - Web Audio API
      // ============================================================

      let audioContext = null;

      function getAudioContext() {
        if (!audioContext) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (!AudioCtx) return null;
          audioContext = new AudioCtx();
        }

        if (audioContext.state === "suspended") {
          audioContext.resume();
        }

        return audioContext;
      }

      function playTone(frequency, duration, type = "sine", volume = 0.06, delay = 0) {
        const ctx = getAudioContext();
        if (!ctx) return;

        const oscillator = ctx.createOscillator();
        const gain = ctx.createGain();

        oscillator.type = type;
        oscillator.frequency.setValueAtTime(frequency, ctx.currentTime + delay);

        gain.gain.setValueAtTime(0.0001, ctx.currentTime + delay);
        gain.gain.exponentialRampToValueAtTime(
          Math.max(volume, 0.001),
          ctx.currentTime + delay + 0.01
        );
        gain.gain.exponentialRampToValueAtTime(
          0.0001,
          ctx.currentTime + delay + duration
        );

        oscillator.connect(gain);
        gain.connect(ctx.destination);

        oscillator.start(ctx.currentTime + delay);
        oscillator.stop(ctx.currentTime + delay + duration + 0.03);
      }

      function playMoveSound(player) {
        if (player === "X") {
          playTone(520, 0.12, "sine", 0.055);
          playTone(680, 0.10, "sine", 0.04, 0.035);
        } else {
          playTone(300, 0.13, "triangle", 0.055);
          playTone(390, 0.10, "triangle", 0.04, 0.035);
        }
      }

      function playWinSound() {
        const notes = [523.25, 659.25, 783.99, 1046.5];

        notes.forEach((note, index) => {
          playTone(note, 0.28, "sine", 0.065, index * 0.085);
        });

        playTone(1567.98, 0.45, "triangle", 0.035, 0.35);
      }

      function playDrawSound() {
        playTone(440, 0.18, "triangle", 0.05);
        playTone(370, 0.22, "triangle", 0.045, 0.14);
        playTone(293.66, 0.3, "triangle", 0.04, 0.29);
      }

      // ============================================================
      // Confetes
      // ============================================================

      const confettiCanvas = document.getElementById("confetti");
      const ctx = confettiCanvas.getContext("2d");

      let confettiParticles = [];
      let confettiAnimation = null;

      function resizeCanvas() {
        const dpr = Math.min(window.devicePixelRatio || 1, 2);

        confettiCanvas.width = window.innerWidth * dpr;
        confettiCanvas.height = window.innerHeight * dpr;

        confettiCanvas.style.width = window.innerWidth + "px";
        confettiCanvas.style.height = window.innerHeight + "px";

        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }

      function launchConfetti() {
        const colors = [
          "#003366",
          "#0056b3",
          "#d97706",
          "#f59e0b",
          "#ffffff"
        ];

        confettiParticles = [];

        for (let i = 0; i < 150; i++) {
          confettiParticles.push({
            x: window.innerWidth / 2 + (Math.random() - 0.5) * 120,
            y: window.innerHeight * 0.38,
            vx: (Math.random() - 0.5) * 13,
            vy: -Math.random() * 14 - 5,
            gravity: 0.25 + Math.random() * 0.15,
            rotation: Math.random() * Math.PI,
            rotationSpeed: (Math.random() - 0.5) * 0.3,
            width: 6 + Math.random() * 7,
            height: 4 + Math.random() * 8,
            color: colors[Math.floor(Math.random() * colors.length)],
            opacity: 1,
            life: 1
          });
        }

        cancelAnimationFrame(confettiAnimation);
        animateConfetti();
      }

      function animateConfetti() {
        ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);

        let alive = false;

        confettiParticles.forEach(particle => {
          particle.vy += particle.gravity;
          particle.x += particle.vx;
          particle.y += particle.vy;
          particle.rotation += particle.rotationSpeed;
          particle.life -= 0.007;

          if (particle.life > 0 && particle.y < window.innerHeight + 40) {
            alive = true;

            ctx.save();
            ctx.globalAlpha = Math.max(0, particle.life);
            ctx.translate(particle.x, particle.y);
            ctx.rotate(particle.rotation);
            ctx.fillStyle = particle.color;
            ctx.fillRect(
              -particle.width / 2,
              -particle.height / 2,
              particle.width,
              particle.height
            );
            ctx.restore();
          }
        });

        if (alive) {
          confettiAnimation = requestAnimationFrame(animateConfetti);
        } else {
          ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
        }
      }

      window.addEventListener("resize", resizeCanvas);
      resizeCanvas();

      // ============================================================
      // Interface
      // ============================================================

      function updateInterface() {
        winsXEl.textContent = state.winsX;
        winsOEl.textContent = state.winsO;

        const totalRounds = state.formatSelect === "bo3" ? 3 : 1;
        roundValueEl.textContent = `${state.currentRound}/${totalRounds}`;

        playerOLabelEl.textContent =
          state.modeSelect === "cpu" ? "Computador O" : "Jogador O";

        cells.forEach((cell, index) => {
          const value = state.options[index];

          cell.textContent = value;
          cell.classList.toggle("x", value === "X");
          cell.classList.toggle("o", value === "O");

          cell.disabled =
            !state.running ||
            Boolean(value) ||
            (state.modeSelect === "cpu" && state.currentPlayer === "O");

          cell.setAttribute(
            "aria-label",
            value
              ? `Célula ${index + 1}: ${value}`
              : `Célula ${index + 1}: vazia`
          );
        });
      }

      function setStatus(message, type = "") {
        statusEl.textContent = message;
        statusEl.className = "status";

        if (type) {
          statusEl.classList.add(type);
        }
      }

      function updateTurnStatus() {
        if (!state.running) return;

        if (state.modeSelect === "cpu" && state.currentPlayer === "O") {
          setStatus("Computador pensando...", "");
          statusEl.classList.add("thinking");
        } else {
          statusEl.classList.remove("thinking");
          setStatus(`Vez do Jogador ${state.currentPlayer}`);
        }
      }

      // ============================================================
      // Vitória / Empate
      // ============================================================

      function getWinningPattern() {
        for (const pattern of winPatterns) {
          const [a, b, c] = pattern;

          if (
            state.options[a] &&
            state.options[a] === state.options[b] &&
            state.options[a] === state.options[c]
          ) {
            return pattern;
          }
        }

        return null;
      }

      function isDraw() {
        return state.options.every(Boolean);
      }

      function drawWinningLine(pattern) {
        if (!pattern) return;

        const firstCell = cells[pattern[0]];
        const lastCell = cells[pattern[2]];

        const boardRect = boardWrap.getBoundingClientRect();
        const firstRect = firstCell.getBoundingClientRect();
        const lastRect = lastCell.getBoundingClientRect();

        const x1 =
          firstRect.left +
          firstRect.width / 2 -
          boardRect.left;

        const y1 =
          firstRect.top +
          firstRect.height / 2 -
          boardRect.top;

        const x2 =
          lastRect.left +
          lastRect.width / 2 -
          boardRect.left;

        const y2 =
          lastRect.top +
          lastRect.height / 2 -
          boardRect.top;

        const dx = x2 - x1;
        const dy = y2 - y1;

        const length = Math.sqrt(dx * dx + dy * dy);
        const angle = Math.atan2(dy, dx) * 180 / Math.PI;

        winLine.style.width = `${length}px`;
        winLine.style.left = `${x1}px`;
        winLine.style.top = `${y1}px`;
        winLine.style.transform = `rotate(${angle}deg)`;

        winLine.classList.add("show");

        pattern.forEach(index => {
          cells[index].classList.add("winning");
        });
      }

      function hideWinningLine() {
        winLine.classList.remove("show");

        cells.forEach(cell => {
          cell.classList.remove("winning");
        });

        winLine.style.width = "0";
      }

      // ============================================================
      // Rodada
      // ============================================================

      function finishRound(winner, pattern) {
        state.running = false;

        if (pattern) {
          drawWinningLine(pattern);
        }

        if (winner === "X") {
          state.winsX++;
        } else {
          state.winsO++;
        }

        updateInterface();

        const winnerName =
          winner === "O" && state.modeSelect === "cpu"
            ? "Computador"
            : `Jogador ${winner}`;

        setStatus(`${winnerName} venceu a rodada!`, "winner");
        playWinSound();
        launchConfetti();

        if (state.formatSelect === "single") {
          return;
        }

        // MD3: dois pontos encerram a partida.
        if (state.winsX >= 2 || state.winsO >= 2) {
          setTimeout(() => showChampion(winner), 700);
          return;
        }

        // Ainda há rodada disponível.
        state.transitionTimer = setTimeout(() => {
          startNextRound();
        }, 2000);
      }

      function finishDraw() {
        state.running = false;

        setStatus("Rodada Empatada!", "draw");
        playDrawSound();

        if (state.formatSelect === "single") {
          return;
        }

        // Empate não incrementa a rodada.
        state.transitionTimer = setTimeout(() => {
          startNextRound(false);
        }, 2000);
      }

      function startNextRound(incrementRound = true) {
        clearTimeout(state.transitionTimer);

        if (incrementRound && state.currentRound < 3) {
          state.currentRound++;
        }

        state.options = Array(9).fill("");
        state.currentPlayer = "X";
        state.running = true;

        hideWinningLine();
        updateInterface();
        setStatus("Vez do Jogador X");

        if (state.modeSelect === "cpu" && state.currentPlayer === "O") {
          scheduleCpuMove();
        }
      }

      // ============================================================
      // Jogada
      // ============================================================

      function makeMove(index, player = state.currentPlayer) {
        if (!state.running) return;
        if (state.options[index]) return;

        if (
          state.modeSelect === "cpu" &&
          state.currentPlayer === "O" &&
          player !== "O"
        ) {
          return;
        }

        state.options[index] = player;

        playMoveSound(player);
        updateInterface();

        const pattern = getWinningPattern();

        if (pattern) {
          finishRound(player, pattern);
          return;
        }

        if (isDraw()) {
          finishDraw();
          return;
        }

        state.currentPlayer = player === "X" ? "O" : "X";

        updateInterface();
        updateTurnStatus();

        if (
          state.running &&
          state.modeSelect === "cpu" &&
          state.currentPlayer === "O"
        ) {
          scheduleCpuMove();
        }
      }

      cells.forEach(cell => {
        cell.addEventListener("click", () => {
          const index = Number(cell.dataset.index);
          makeMove(index);
        });
      });

      // ============================================================
      // IA
      // ============================================================

      function scheduleCpuMove() {
        clearTimeout(state.cpuTimer);

        if (!state.running || state.currentPlayer !== "O") {
          return;
        }

        state.cpuTimer = setTimeout(() => {
          const move = chooseCpuMove();

          if (move !== -1 && state.running && state.currentPlayer === "O") {
            makeMove(move, "O");
          }
        }, 400);
      }

      function chooseCpuMove() {
        const available = state.options
          .map((value, index) => value === "" ? index : -1)
          .filter(index => index !== -1);

        if (!available.length) return -1;

        // 1. Vencer imediatamente.
        for (const index of available) {
          state.options[index] = "O";

          if (getWinningPattern()) {
            state.options[index] = "";
            return index;
          }

          state.options[index] = "";
        }

        // 2. Bloquear vitória do X.
        for (const index of available) {
          state.options[index] = "X";

          if (getWinningPattern()) {
            state.options[index] = "";
            return index;
          }

          state.options[index] = "";
        }

        // 3. Centro.
        if (state.options[4] === "") {
          return 4;
        }

        // 4. Cantos.
        const corners = [0, 2, 6, 8].filter(
          index => state.options[index] === ""
        );

        if (corners.length) {
          return corners[Math.floor(Math.random() * corners.length)];
        }

        // 5. Qualquer posição restante.
        return available[Math.floor(Math.random() * available.length)];
      }

      // ============================================================
      // Reinício / configurações
      // ============================================================

      function resetGame() {
        clearTimeout(state.transitionTimer);
        clearTimeout(state.cpuTimer);

        state.options = Array(9).fill("");
        state.currentPlayer = "X";
        state.running = true;
        state.winsX = 0;
        state.winsO = 0;
        state.currentRound = 1;

        hideWinningLine();
        closeChampion();

        ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);

        updateInterface();
        setStatus("Vez do Jogador X");
      }

      modeSelect.addEventListener("change", () => {
        state.modeSelect = modeSelect.value;
        resetGame();
      });

      formatSelect.addEventListener("change", () => {
        state.formatSelect = formatSelect.value;
        resetGame();
      });

      resetButton.addEventListener("click", resetGame);

      // ============================================================
      // Campeão MD3
      // ============================================================

      function showChampion(winner) {
        const winnerName =
          winner === "O" && state.modeSelect === "cpu"
            ? "Computador"
            : `Jogador ${winner}`;

        championTitle.textContent = `${winnerName} é o campeão!`;

        championText.textContent =
          `Placar final: Jogador X ${state.winsX} × ${state.winsO} ${
            state.modeSelect === "cpu" ? "Computador O" : "Jogador O"
          }.`;

        championOverlay.classList.add("show");
      }

      function closeChampion() {
        championOverlay.classList.remove("show");
      }

      championClose.addEventListener("click", closeChampion);

      championOverlay.addEventListener("click", event => {
        if (event.target === championOverlay) {
          closeChampion();
        }
      });

      // ============================================================
      // Inicialização
      // ============================================================

      updateInterface();
      setStatus("Vez do Jogador X");

      // Permite que o primeiro clique também inicialize o contexto de áudio.
      document.addEventListener(
        "pointerdown",
        () => {
          getAudioContext();
        },
        { once: true }
      );
    })();
  </script>
</body>
